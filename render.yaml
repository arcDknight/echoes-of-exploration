# Free deploy of site + AI backend on Render. Secrets are set in the Render dashboard (Environment tab), never in this file.
services:
  - type: web
    name: echoes-of-exploration
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: LLM_PROVIDER
        value: groq
      - key: STRICT_FACTS
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
